<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Consulta de DNI - MARCELO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Fuentes e Iconos de Alta Calidad -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #020617;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --accent-hover: #0ea5e9;
      --glass-bg: rgba(15, 23, 42, 0.55);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #64748b;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      /* Evita la selección de texto innecesaria */
      user-select: none;
    }

    body {
      background: var(--primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
    }

    /* CAPAS DE AURORAS DINÁMICAS EN EL FONDO */
    .aurora-1, .aurora-2 {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -2;
      opacity: 0.4;
      pointer-events: none;
    }
    .aurora-1 {
      background: #1d4ed8;
      top: 15%;
      left: 10%;
      animation: floatAurora 12s infinite alternate ease-in-out;
    }
    .aurora-2 {
      background: #701a75;
      bottom: 15%;
      right: 10%;
      animation: floatAurora 16s infinite alternate-reverse ease-in-out;
    }

    @keyframes floatAurora {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.2); }
    }

    /* MARCA DE AGUA PRINCIPAL GIGANTE Y CENTRADA */
    .marca-agua-fondo {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-weight: 900;
      font-size: 15vw;
      color: rgba(56, 189, 248, 0.09);
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.04);
      white-space: nowrap;
      pointer-events: none;
      z-index: -1;
      text-transform: uppercase;
      letter-spacing: 6px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: var(--glass-bg);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 36px 28px;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8), 
                  inset 0 1px 0px rgba(255, 255, 255, 0.1);
      z-index: 10;
      animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes scaleIn {
      from { transform: translateY(25px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .header-zone {
      text-align: center;
      margin-bottom: 32px;
    }

    .header-zone .icon-wrapper {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(56, 189, 248, 0.02));
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
      color: var(--accent);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    h2 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(120deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-relative {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-relative i {
      position: absolute;
      left: 18px;
      color: var(--text-muted);
      font-size: 18px;
      transition: all 0.3s ease;
    }

    input {
      width: 100%;
      padding: 18px 18px 18px 52px;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      background: rgba(7, 10, 19, 0.6);
      font-size: 16px;
      color: white;
      font-weight: 600;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 3px;
    }

    input::placeholder {
      letter-spacing: normal;
      color: var(--text-muted);
      font-weight: 400;
    }

    input:focus {
      border-color: var(--accent);
      background: rgba(7, 10, 19, 0.85);
      box-shadow: 0 0 0 5px var(--accent-glow);
    }

    input:focus + i {
      color: var(--accent);
      transform: scale(1.1);
    }

    button {
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, var(--accent) 0%, #0284c7 100%);
      color: #000;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.3);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    button:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .resultado {
      position: relative;
      margin-top: 28px;
      border-radius: 18px;
      transition: all 0.4s ease;
    }

    .resultado-box {
      padding: 24px;
      background: rgba(7, 10, 19, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      overflow: hidden;
      animation: slideDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .resultado-box::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: scanEffect 2s linear infinite;
    }

    @keyframes scanEffect {
      0% { top: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .resultado-box::before {
      content: "BY MARCELO";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-15deg);
      font-size: 44px;
      color: rgba(255, 255, 255, 0.04);
      font-weight: 800;
      pointer-events: none;
      white-space: nowrap;
      letter-spacing: 3px;
    }

    .dato {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .dato:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .label {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
    }

    .val {
      font-size: 15px;
      color: var(--text-main);
      font-weight: 600;
      text-align: right;
    }

    .dir-divider {
      border: none;
      border-top: 1px dashed rgba(255, 255, 255, 0.12);
      margin: 10px 0;
    }

    .error {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      padding: 18px;
      border-radius: 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
    }

    .loading {
      background: rgba(56, 189, 248, 0.05);
      border: 1px solid rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 18px;
      border-radius: 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      margin-top: 32px;
      font-size: 12px;
      color: #475569;
      letter-spacing: 0.5px;
      text-align: center;
      z-index: 10;
    }

    @media (max-width: 480px) {
      .marca-agua-fondo { font-size: 18vw; }
      .container { padding: 32px 20px; }
      h2 { font-size: 20px; }
      input { padding: 16px 16px 16px 48px; font-size: 15px; }
      button { padding: 16px; }
    }
  </style>
</head>

<body>

  <div class="aurora-1"></div>
  <div class="aurora-2"></div>

  <div class="marca-agua-fondo">MARCELO TECH</div>

  <div class="container">
    <div class="header-zone">
      <div class="icon-wrapper">
        <i class="fa-solid fa-id-card"></i>
      </div>
      <h2>🔍 Consulta de DNI - BASICO</h2>
    </div>

    <form id="form-dni">
      <div class="input-relative">
        <input type="text" id="dni" placeholder="Ingrese DNI (8 dígitos)" inputmode="numeric" pattern="[0-9]*" maxlength="8" required>
        <i class="fa-solid fa-fingerprint"></i>
      </div>
      <button type="submit">Buscar</button>
    </form>

    <div id="resultado" class="resultado"></div>
  </div>

  <footer>© 2026 Marcelo. Todos los derechos reservados.</footer>

  <script>
    const token = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxNTQsImV4cCI6MTc1MzM5NzYyM30.xyDaXDc-m_ezGm_uB-2RF2BHnMisBquK_pxJN2T5j5g';

    document.getElementById('form-dni').addEventListener('submit', async function (e) {
      e.preventDefault();

      const dni = document.getElementById('dni').value.trim();
      const resultado = document.getElementById('resultado');

      if (dni.length !== 8 || isNaN(dni)) {
        resultado.className = 'resultado error';
        resultado.innerHTML = '❌ DNI inválido.';
        return;
      }

      resultado.className = 'resultado loading';
      resultado.innerHTML = '<div class="spinner"></div> ⏳ Consultando datos...';

      try {
        const response = await fetch(`https://miapi.cloud/v1/dni/${dni}`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        const data = await response.json();

        if (data.success && data.datos) {
          const info = data.datos;

          resultado.className = 'resultado';
          resultado.innerHTML = `
            <div class="resultado-box">
              <div class="dato"><span class="label">✅ DNI:</span> <span class="val" style="color: var(--accent);">${info.dni || dni}</span></div>
              <div class="dato"><span class="label">Nombres:</span> <span class="val">${info.nombres || 'N/A'}</span></div>
              <div class="dato"><span class="label">Apellido Paterno:</span> <span class="val">${info.ape_paterno || 'N/A'}</span></div>
              <div class="dato"><span class="label">Apellido Materno:</span> <span class="val">${info.ape_materno || 'N/A'}</span></div>

              ${info.domiciliado ? `
                <hr class="dir-divider">
                <div class="dato"><span class="label">Dirección:🏠</span> <span class="val">${info.domiciliado.direccion || ''}</span></div>
                <div class="dato"><span class="label">Distrito:</span> <span class="val">${info.domiciliado.distrito || ''}</span></div>
                <div class="dato"><span class="label">Provincia:</span> <span class="val">${info.domiciliado.provincia || ''}</span></div>
                <div class="dato"><span class="label">Departamento:</span> <span class="val">${info.domiciliado.departamento || ''}</span></div>
              ` : ''}
            </div>
          `;
        } else {
          resultado.className = 'resultado error';
          resultado.innerHTML = '❌ No se encontraron datos.';
        }

      } catch (error) {
        resultado.className = 'resultado error';
        resultado.innerHTML = '⚠️ Error al conectar.';
      }
    });

    // ==========================================
    // SCRIPT DE SEGURIDAD - ANTI INSPECCIÓN
    // ==========================================

    // 1. Bloquear clic derecho
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });

    // 2. Bloquear combinaciones de teclas comunes (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U)
    document.addEventListener('keydown', function(e) {
      if (
        e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
        (e.ctrlKey && e.key === 'u')
      ) {
        e.preventDefault();
        return false;
      }
    });

    // 3. Limpieza constante de la consola para evitar lectura del Token
    setInterval(function() {
      console.clear();
    }, 1000);
  </script>

</body>
</html>
